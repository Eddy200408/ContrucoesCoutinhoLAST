<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maddie Tavares - Onde a Beleza Encontra a Excelência</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f8f8f8;
            color: #333;
            overflow-x: hidden;
        }
        
        /* Container principal com imagem de fundo */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 700px;
            background-image: url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1887&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* Degradê branco na parte inferior da imagem */
        .hero-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 60%, rgba(255,255,255,1) 100%);
            pointer-events: none;
        }
        
        
        
        /* Conteúdo principal sobre a imagem */
        .hero-content {
            position: absolute;
            bottom: 15%;
            left: 5%;
            z-index: 5;
            max-width: 600px;
        }
        
        .hero-title {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.1;
            color: #2c3e50;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }
        
        .hero-title span {
            color: #d4a574;
        }
        
        .hero-subtitle {
            font-size: 1.5rem;
            color: #34495e;
            font-weight: 400;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        /* Seção de informações */
        .info-section {
            padding: 80px 5%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        .info-title {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .info-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #5d6d7e;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Rodapé */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 40px 5%;
            text-align: center;
        }
        
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .footer-logo {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #d4a574;
        }
        
        .copyright {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #4a6278;
        }
        
        /* Responsividade */
        @media (max-width: 992px) {
            .hero-title {
                font-size: 3rem;
            }
            
            nav ul li {
                margin-left: 25px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 20px 5%;
            }
            
            .logo {
                margin-bottom: 15px;
            }
            
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                margin-bottom: 15px;
            }
            
            nav ul li {
                margin: 5px 15px;
            }
            
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-subtitle {
                font-size: 1.2rem;
            }
            
            .hero-content {
                bottom: 10%;
            }
        }
        
        @media (max-width: 576px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
            }
            
            .info-title {
                font-size: 2rem;
            }
            
            .enter-btn {
                padding: 8px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Container principal com imagem de fundo -->
    <div class="hero-container">
      
        
        <!-- Conteúdo sobre a imagem -->
        <div class="hero-content">
            <h1 class="hero-title">Onde a Beleza Encontra a <span>Excelência</span></h1>
            <p class="hero-subtitle">Uma jornada de transformação e bem-estar em Cabo Verde</p>
        </div>
        
        <!-- Degradê é aplicado via pseudo-elemento no CSS -->
    </div>
    
    <!-- Seção de informações -->
  
    
    <!-- Rodapé -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">MADDIE TAVARES</div>
            <p>Onde a beleza encontra a excelência em Cabo Verde</p>
            <div class="copyright">
                &copy; 2023 Maddie Tavares - Todos os direitos reservados.
            </div>
        </div>
        
    </footer>
    

</body>
</html>
